name: check / vulnerabilities

# Runs the vulnerability analyzer of the Grafana plugin validator on the
# lockfiles, the same check the Grafana plugin catalog performs on publish.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pr-checks-vulns.yml'
      - 'Makefile'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'yarn.lock'
      - '**/package.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr-checks-vulns.yml'
      - 'Makefile'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'yarn.lock'
      - '**/package.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vuln-check:
    name: plugin validator / osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Tool versions are declared in the Makefile, so its hash keys the cache.
      - name: Cache tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ./bin
          key: ${{ runner.os }}-bin-${{ github.job }}-${{ hashFiles('Makefile', 'scripts/install-plugincheck2.sh') }}

      - name: Check dependencies for vulnerabilities
        run: make vm-plugin-vuln-check
