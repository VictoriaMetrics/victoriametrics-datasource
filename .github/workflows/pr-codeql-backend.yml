name: codeql / backend

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-checks-backend.yml
      - go.*
      - vendor/**
      - pkg/**
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
    paths:
      - .github/workflows/pr-checks-backend.yml
      - go.*
      - vendor/**
      - pkg/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true
        if: ${{ matrix.language == 'go' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3.39.1
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3.39.1
