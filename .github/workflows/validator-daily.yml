name: Daily plugin validator

# The OSV database changes without any commit in this repository, so once a
# day this workflow re-checks the dependencies on main. Upgrades of the
# validator itself are proposed by Renovate, see .github/renovate.json5.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln-check:
    name: plugin validator / osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ./bin
          key: ${{ runner.os }}-bin-${{ github.job }}-${{ hashFiles('Makefile', 'scripts/install-plugincheck2.sh') }}

      - name: Check dependencies for vulnerabilities
        run: make vm-plugin-vuln-check
