name: codeql / frontend

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-codeql-frontend.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '**/yarn.lock'
      - '**/package.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-codeql-frontend.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '**/yarn.lock'
      - '**/package.json'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
      with:
        languages: "javascript"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
