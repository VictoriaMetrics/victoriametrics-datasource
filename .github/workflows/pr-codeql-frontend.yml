name: codeql / frontend

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-codeql-frontend.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '**/yarn.lock'
      - '**/package.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-codeql-frontend.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '**/yarn.lock'
      - '**/package.json'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        fetch-depth: 2
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3.39.1
      with:
        languages: "javascript"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3.39.1
