name: check / frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-checks-frontend.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/yarn.lock'
      - '**/package.json'
      - '**/Makefile'
      - '**/Dockerfile'
      - '.nvmrc'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-checks-frontend.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/yarn.lock'
      - '**/package.json'
      - '**/Makefile'
      - '**/Dockerfile'
      - '.nvmrc'

jobs:
  run-check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install all dependencies
        run: yarn install

      - name: Build lezer-metricsql
        run: yarn build:lezer-metricsql

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test:ci

      - name: Run typecheck
        run: yarn typecheck