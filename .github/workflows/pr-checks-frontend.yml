name: check / frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-checks-frontend.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/yarn.lock'
      - '**/package.json'
      - '**/Makefile'
      - '**/Dockerfile'
      - '.nvmrc'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-checks-frontend.yml'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/yarn.lock'
      - '**/package.json'
      - '**/Makefile'
      - '**/Dockerfile'
      - '.nvmrc'

jobs:
  run-check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install all dependencies
        run: yarn install

      - name: Build lezer-metricsql
        run: yarn build:lezer-metricsql

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test:ci

      - name: Run typecheck
        run: yarn typecheck